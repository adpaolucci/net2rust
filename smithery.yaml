# Smithery configuration for net2rust
# https://smithery.ai
name: net2rust-mcp
version: "0.1.0"
description: "55 pure-Rust Windows & cross-platform network diagnostics, NDIS ETW packet capture, LAN, OSINT, and Wi-Fi/BLE tools with policy-gated stdio MCP server (R4 credential-free)"
repository: "https://github.com/adpaolucci/net2rust"
license: "Apache-2.0"

entrypoint:
  type: stdio
  command: net2rust-mcp

build:
  type: cargo
  crate: net2rust-mcp

# All 68 MCP endpoints (55 read-only TableProviders + 13 policy-gated ActionCommands)
tools:
  # -sockets (13 TableProviders)
  - name: sockets.ports
    description: "CurrPorts equivalent: enumerate active TCP/UDP sockets, owning processes, and connection states (mutating close_socket gated)."
  - name: sockets.tcplog
    description: "TcpLogView equivalent: track TCP socket open, close, and listen state transitions."
  - name: sockets.live
    description: "LiveTcpUdpWatch equivalent: live ETW Kernel-Network TCP/UDP activity per socket and PID."
  - name: sockets.app-net
    description: "AppNetworkCounter equivalent: per-application TCP/UDP byte and bandwidth counters via ETW."
  - name: sockets.proc-tcp
    description: "ProcessTCPSummary equivalent: per-process TCP state counts and throughput summary."
  - name: sockets.tcp-errors
    description: "TCPConnectProblemView equivalent: TCP connection timeouts, refusals, and retransmissions."
  - name: sockets.dns-log
    description: "DNSLookupView equivalent: DNS client lookup telemetry and local resolver cache."
  - name: sockets.counters
    description: "NetworkCountersWatch equivalent: IPv4/IPv6/TCP/UDP/ICMP protocol stack counters and deltas."
  - name: sockets.adapter-watch
    description: "AdapterWatch equivalent: network interface link speed, throughput rates, errors, and discards."
  - name: sockets.interfaces
    description: "NetworkInterfacesView equivalent: full network adapter configuration, IPv4/IPv6, gateways, DNS, and DHCP."
  - name: sockets.routes
    description: "NetRouteView equivalent: IPv4/IPv6 routing table inspector (mutating route create/delete gated)."
  - name: sockets.neighbors
    description: "IPNeighborsView equivalent: ARP and IPv6 NDP neighbor cache with OUI vendor lookup."
  - name: sockets.paths
    description: "IPPathTableView equivalent: OS IP path table, next-hop RTT, link speed, and MTU."
  # -capture (11 TableProviders) - R4 credential-free
  - name: capture.sniff
    description: "SmartSniff equivalent: IPv4/IPv6 TCP/UDP/ICMP stream summary via NDIS ETW, optional Npcap, or offline PCAP/PCAPNG/ETL."
  - name: capture.traffic
    description: "NetworkTrafficView equivalent: aggregated traffic flows by protocol, endpoint, port, and byte volume."
  - name: capture.http
    description: "HTTPNetworkSniffer equivalent: HTTP request/response metadata without Authorization or credential extraction (R4)."
  - name: capture.dns
    description: "DNSQuerySniffer equivalent: wire-level RFC 1035 DNS queries, answers, TTLs, and latency."
  - name: capture.dhcp
    description: "DHCPLogView equivalent: BOOTP/DHCPv4 Discover/Offer/Request/Ack lease transaction decoder."
  - name: capture.mdns
    description: "mDNSView equivalent: Multicast DNS (UDP 5353) and DNS-SD service discovery listener."
  - name: capture.whois-lan
    description: "WhoIsConnectedSniffer equivalent: passive ARP/DHCP/mDNS/NetBIOS/SSDP LAN host discovery."
  - name: capture.cookies
    description: "WebCookiesSniffer equivalent: HTTP Cookie/Set-Cookie header names, domains, and flags with sensitive token redaction (R4)."
  - name: capture.website
    description: "WebSiteSniffer equivalent: HTTP static asset URL and content-type reconstruction from captures."
  - name: capture.latency
    description: "NetworkLatencyView equivalent: passive TCP SYN to SYN-ACK round-trip latency analyzer."
  - name: capture.wifi-mon
    description: "WifiChannelMonitor equivalent: 802.11 RadioTap/beacon/probe channel analyzer (offline PCAP or monitor mode)."
  # -lan (11 TableProviders)
  - name: lan.ping
    description: "PingInfoView equivalent: concurrent ICMP and TCP ping monitor with loss and RTT statistics."
  - name: lan.trace
    description: "CountryTraceRoute equivalent: ICMP traceroute with offline GeoIP country and ASN enrichment."
  - name: lan.scan
    description: "LANIPScanner equivalent: concurrent ARP, ICMP, NetBIOS, and port scanner across CIDR ranges."
  - name: lan.wnetwatcher
    description: "Wireless Network Watcher equivalent: active subnet ARP sweep with MAC OUI vendor identification."
  - name: lan.connect-log
    description: "NetworkConnectLog equivalent: LAN host arrival and departure diff logger."
  - name: lan.wol
    description: "WakeMeOnLan equivalent: LAN host inventory (mutating Wake-on-LAN magic packet send gated)."
  - name: lan.netbios
    description: "NetBScanner equivalent: UDP 137 NBSTAT NetBIOS node status and workgroup scanner."
  - name: lan.shares
    description: "NetResView equivalent: Windows SMB/WNet shared folder and network resource enumerator."
  - name: lan.openfiles
    description: "NetworkOpenedFiles equivalent: SMB server open-file and lock inspector (mutating close_file gated)."
  - name: lan.resolve
    description: "FastResolver equivalent: parallel forward/reverse DNS and MAC OUI batch resolver."
  - name: lan.speedtest
    description: "DownTester equivalent: multi-target HTTP/HTTPS download throughput benchmark."
  # -osint (10 TableProviders)
  - name: osint.ipnet
    description: "IPNetInfo equivalent: RIR WHOIS (TCP 43) and RDAP IP block, org, and abuse contact lookup."
  - name: osint.whosip
    description: "WhosIP equivalent: IP WHOIS/RDAP resolver with referral chasing and ASN mapping."
  - name: osint.ipoffline
    description: "IPInfoOffline equivalent: embedded offline IPv4/IPv6 CIDR to country and ASN lookup."
  - name: osint.whois-domain
    description: "WhoisThisDomain equivalent: IANA and registrar WHOIS/RDAP domain registration lookup."
  - name: osint.whoiscl
    description: "WhoisCL equivalent: deterministic batch CLI WHOIS query runner."
  - name: osint.dns
    description: "DNSDataView equivalent: direct DNS A, AAAA, MX, NS, TXT, SOA, CNAME, PTR, SRV, CAA resolver."
  - name: osint.hosting
    description: "DomainHostingView equivalent: aggregated WHOIS, DNS, ASN, web host, and mail provider profiler."
  - name: osint.oui
    description: "MACAddressView equivalent: embedded offline IEEE MA-L/MA-M/MA-S MAC OUI vendor lookup."
  - name: osint.set-dns
    description: "QuickSetDNS equivalent: interface DNS server inspector (mutating DNS change gated)."
  - name: osint.net-profiles
    description: "NetConnectChoose equivalent: Windows NetworkList profile inspector (mutating connect/disconnect gated)."
  # -radio (10 TableProviders) - R4 no plaintext Wi-Fi keys
  - name: radio.wifi-info
    description: "WifiInfoView equivalent: 802.11 BSS/IE scanner (HT/VHT/HE/EHT, channel, RSSI, security mode, zero key extraction)."
  - name: radio.wifi-scan
    description: "WirelessNetView equivalent: continuous Wi-Fi availability, signal average, and detection counter."
  - name: radio.wifi-console
    description: "WirelessNetConsole equivalent: streaming console Wi-Fi scan table."
  - name: radio.wifi-conn
    description: "WirelessConnectionInfo equivalent: active Wi-Fi association PHY, channel, Tx/Rx rates, and RSSI."
  - name: radio.wifi-profiles
    description: "ManageWirelessNetworks equivalent: saved WLAN profile metadata with R4 keyMaterial redaction (mutating reorder/delete/toggle-auto gated)."
  - name: radio.wifi-hosted
    description: "HostedNetworkStarter equivalent: Windows Hosted Network status inspector (mutating start/stop gated)."
  - name: radio.bt-view
    description: "BluetoothView equivalent: Bluetooth Classic device discovery monitor."
  - name: radio.bt-log
    description: "BluetoothLogView equivalent: Bluetooth device arrival and departure event log."
  - name: radio.bt-cl
    description: "BluetoothCL equivalent: deterministic Bluetooth Classic enumeration."
  - name: radio.ble
    description: "BluetoothLEView equivalent: Bluetooth Low Energy (BLE) advertisement, RSSI, service UUID, and manufacturer data scanner."
  # Mutating ActionCommands (13, policy-gated)
  - name: sockets.ports.close
    description: "Terminate an active IPv4 TCP connection using SetTcpEntry (MIB_TCP_STATE_DELETE_TCB) (privileged mutating, policy-gated)."
  - name: sockets.routes.add
    description: "Add a persistent or active IPv4/IPv6 route via CreateIpForwardEntry2 (privileged mutating, policy-gated)."
  - name: sockets.routes.delete
    description: "Delete an existing IPv4/IPv6 route via DeleteIpForwardEntry2 (privileged mutating, policy-gated)."
  - name: lan.wol.send
    description: "Send a 102-byte UDP Wake-on-LAN Magic Packet (port 9 or 7) to wake a host (mutating, policy-gated)."
  - name: lan.openfiles.close
    description: "Close an open SMB file handle by ID via NetFileClose (privileged mutating, policy-gated)."
  - name: osint.set-dns.apply
    description: "Apply static DNS servers or reset to DHCP on a network interface (privileged mutating, policy-gated)."
  - name: osint.net-profiles.connect
    description: "Connect/enable the adapter associated with a Windows NetworkList profile (privileged mutating, policy-gated)."
  - name: osint.net-profiles.disconnect
    description: "Disconnect/disable the adapter associated with a Windows NetworkList profile (privileged mutating, policy-gated)."
  - name: radio.wifi-profiles.set-order
    description: "Set the preference position (0-based) of a saved WLAN profile on a wireless interface (mutating, policy-gated)."
  - name: radio.wifi-profiles.delete
    description: "Delete a saved WLAN profile from a wireless interface (mutating, policy-gated)."
  - name: radio.wifi-profiles.toggle-auto
    description: "Toggle or set <connectionMode> ('auto' / 'manual') on a saved WLAN profile (mutating, policy-gated)."
  - name: radio.wifi-hosted.start
    description: "Initialize and start the Windows Wireless Hosted Network (SoftAP) without querying or exposing keys (privileged mutating, policy-gated)."
  - name: radio.wifi-hosted.stop
    description: "Stop the Windows Wireless Hosted Network (SoftAP) (privileged mutating, policy-gated)."
