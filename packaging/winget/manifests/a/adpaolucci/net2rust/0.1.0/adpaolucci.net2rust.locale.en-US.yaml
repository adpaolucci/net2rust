Description: >-
  net2rust is a pure-Rust, credential-free network diagnostics and telemetry workstation covering
  55 tools across sockets/ETW, packet capture, LAN discovery, OSINT/WHOIS/DNS, and Wi-Fi/BLE
  with a native zero-GPU Win32 desktop console (net2rust-win32 via WinSafe), a cross-platform
  Iced GUI (net2rust-iced), a unified CLI, SHA-256/512 Merkle custody exports, and a policy-gated
  JSON-RPC 2.0 stdio MCP server (net2rust-mcp).
